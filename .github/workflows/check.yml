name: Check ClipForge
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --test tests-product/core.test.mjs
      - run: python -m pip install -r worker/requirements-agent.txt
      - run: python -m unittest discover -s tests-product -p 'test_*.py' -v
      - run: npm run build
